<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d9534f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ポモドーロ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" id="favicon" href="icon.svg">
<title>スケジュール式ポモドーロ</title>
<style>
  :root { --bg:#fafaf7; --card:#fff; --text:#222; --muted:#777; --work:#d9534f; --break:#3fa66b; --long:#3b7dd8; --line:#e5e5e0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#181818; --card:#242424; --text:#eee; --muted:#999; --line:#383838; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,"Hiragino Sans",sans-serif; -webkit-text-size-adjust:100%; }
  main { max-width:560px; margin:0 auto; padding:max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(48px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; margin-bottom:16px; }
  h2 { font-size:15px; margin:0 0 12px; }
  .timer { text-align:center; }
  .phase { font-size:20px; font-weight:700; }
  .time { font-size:clamp(56px, 20vw, 88px); font-weight:700; font-variant-numeric:tabular-nums; line-height:1.1; margin:8px 0; }
  .sub { color:var(--muted); font-size:14px; min-height:20px; }
  .dots { display:flex; justify-content:center; gap:8px; margin:12px 0; }
  .dot { width:12px; height:12px; border-radius:50%; background:var(--line); }
  .dot.done { background:var(--work); }
  .dot.now { outline:2px solid var(--work); outline-offset:2px; }
  .bar { height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin-top:12px; }
  .bar > div { height:100%; width:0; transition:width .5s linear; }
  button { font:inherit; min-height:44px; padding:8px 16px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--text); cursor:pointer; }
  button.primary { background:var(--work); color:#fff; border-color:var(--work); }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .center { justify-content:center; }
  .sched { display:flex; align-items:center; gap:8px; padding:8px 0; border-top:1px solid var(--line); flex-wrap:wrap; }
  .sched .days { color:var(--muted); font-size:13px; flex:1; min-width:120px; }
  input[type=time] { font:inherit; min-height:44px; padding:6px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--text); }
  input[type=checkbox] { width:20px; height:20px; }
  .daypick label { display:inline-flex; align-items:center; gap:4px; font-size:14px; margin-right:6px; min-height:36px; }
  .tag { font-size:12px; padding:2px 8px; border-radius:10px; background:var(--line); color:var(--muted); }
  .tag.on { background:var(--break); color:#fff; }
  .opts label { display:flex; align-items:center; gap:8px; min-height:36px; }
  .hint { color:var(--muted); font-size:13px; line-height:1.6; }
</style>
</head>
<body>
<main>
  <section class="card timer">
    <div class="row center"><span class="tag" id="modeTag">待機中</span></div>
    <div class="phase" id="phase">待機中</div>
    <div class="time" id="time">25:00</div>
    <div class="dots" id="dots"></div>
    <div class="sub" id="sub"></div>
    <div class="bar"><div id="barFill"></div></div>
    <div class="row center" style="margin-top:16px">
      <button class="primary" id="startBtn">今すぐ開始</button>
      <button id="stopBtn">停止</button>
      <button id="pipBtn" hidden>小窓で表示</button>
    </div>
  </section>

  <section class="card">
    <h2>スケジュール(この時間帯に自動開始)</h2>
    <div class="row daypick" id="daypick"></div>
    <div class="row" style="margin-top:10px">
      <input type="time" id="newStart" value="09:00">
      <span>〜</span>
      <input type="time" id="newEnd" value="12:00">
      <button id="addBtn">追加</button>
    </div>
    <div id="list" style="margin-top:12px"></div>
    <div class="opts" style="margin-top:12px">
      <label><input type="checkbox" id="autoOn"> 自動開始を有効にする</label>
      <label><input type="checkbox" id="notifyOn"> 通知・音</label>
      <label><input type="checkbox" id="wakeOn"> 画面を消灯させない(タイマー表示中)</label>
    </div>
  </section>

  <p class="hint">サイクル: 作業25分→休憩5分を3回、4回目の休憩は20分(計135分)。スケジュールの開始時刻が1セット目の起点です。<br>
  自動開始・通知はこのページ(またはホーム画面のアプリ)を開いている間に動作します。別タブにいる間は、タブのタイトルとアイコンに残り時間が表示されます。</p>
</main>

<script>
const WORK = 25, SHORT = 5, LONG = 20;
const PHASES = [];
for (let i = 1; i <= 4; i++) {
  PHASES.push({ kind:'work', min:WORK, set:i });
  PHASES.push({ kind:'break', min:i === 4 ? LONG : SHORT, set:i, long:i === 4 });
}
const CYCLE = PHASES.reduce((a, p) => a + p.min, 0) * 60000;
const DAYS = ['日','月','火','水','木','金','土'];
const HEX = { work:'#d9534f', break:'#3fa66b', long:'#3b7dd8', idle:'#888888' };
const CSS = { work:'var(--work)', break:'var(--break)', long:'var(--long)' };

const load = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

let schedules = load('pomo.schedules', [{ start:'09:00', end:'12:00', days:[1,2,3,4,5], on:true }]);
let settings = Object.assign({ auto:true, notify:true, wake:false }, load('pomo.settings', {}));
let manualStart = load('pomo.manual', null);
let lastKey = null;
let pip = null;
let wakeLock = null;

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');

function atTime(date, hhmm) {
  const [h, m] = hhmm.split(':').map(Number);
  const d = new Date(date); d.setHours(h, m, 0, 0); return d;
}

// 現在有効なスケジュール枠の開始・終了を返す(日跨ぎ対応)
function activeWindow(now) {
  if (!settings.auto) return null;
  for (const s of schedules) {
    if (!s.on) continue;
    for (const back of [0, 1]) {
      const base = new Date(now); base.setDate(base.getDate() - back);
      if (!s.days.includes(base.getDay())) continue;
      const st = atTime(base, s.start);
      let en = atTime(base, s.end);
      if (en <= st) en = new Date(en.getTime() + 86400000);
      if (now >= st && now < en) return { st, en };
    }
  }
  return null;
}

function nextWindow(now) {
  let best = null;
  if (!settings.auto) return null;
  for (const s of schedules) {
    if (!s.on) continue;
    for (let d = 0; d < 8; d++) {
      const base = new Date(now); base.setDate(base.getDate() + d);
      if (!s.days.includes(base.getDay())) continue;
      const st = atTime(base, s.start);
      if (st > now && (!best || st < best)) best = st;
    }
  }
  return best;
}

function phaseAt(elapsed) {
  let t = elapsed % CYCLE;
  for (let i = 0; i < PHASES.length; i++) {
    const len = PHASES[i].min * 60000;
    if (t < len) return { p:PHASES[i], idx:i, left:len - t, len };
    t -= len;
  }
}

const fmt = ms => { const s = Math.ceil(ms / 1000); return pad(Math.floor(s / 60)) + ':' + pad(s % 60); };
const fmtHM = d => pad(d.getHours()) + ':' + pad(d.getMinutes());
const kindOf = p => p.kind === 'work' ? 'work' : (p.long ? 'long' : 'break');
const label = p => p.kind === 'work' ? `作業 ${p.set}/4` : (p.long ? '長い休憩(20分)' : '休憩(5分)');

function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.25, 0.5].forEach(t => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.2, ctx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.2);
      o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.2);
    });
  } catch {}
}

function announce(text) {
  if (!settings.notify) return;
  beep();
  try { if ('Notification' in window && Notification.permission === 'granted') new Notification('ポモドーロ', { body:text }); } catch {}
}

// ---- ファビコン(別タブでも残り分数が見える) ----
const fav = document.createElement('canvas'); fav.width = fav.height = 64;
let favKey = '';
function setFavicon(text, color) {
  if (favKey === text + color) return;
  favKey = text + color;
  const c = fav.getContext('2d');
  c.clearRect(0, 0, 64, 64);
  c.fillStyle = color;
  c.beginPath(); c.roundRect(0, 0, 64, 64, 14); c.fill();
  c.fillStyle = '#fff';
  c.font = `bold ${text.length > 2 ? 34 : 44}px -apple-system, sans-serif`;
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(text, 32, 36);
  $('favicon').href = fav.toDataURL('image/png');
}

// ---- フローティング小窓(Document Picture-in-Picture) ----
async function openPip() {
  if (pip) { pip.close(); return; }
  try {
    pip = await documentPictureInPicture.requestWindow({ width:260, height:150 });
  } catch { return; }
  const d = pip.document;
  d.body.style.cssText = 'margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:-apple-system,"Hiragino Sans",sans-serif;color:#fff;background:#888;transition:background .3s';
  d.body.innerHTML = '<div id="p" style="font-size:16px;font-weight:700"></div><div id="t" style="font-size:56px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1"></div><div id="s" style="font-size:12px;opacity:.85"></div>';
  pip.addEventListener('pagehide', () => { pip = null; $('pipBtn').textContent = '小窓で表示'; });
  $('pipBtn').textContent = '小窓を閉じる';
  tick();
}

function renderPip(phase, time, sub, color) {
  if (!pip) return;
  const d = pip.document;
  const p = d.getElementById('p'); if (!p) return;
  p.textContent = phase;
  d.getElementById('t').textContent = time;
  d.getElementById('s').textContent = sub;
  d.body.style.background = color;
}

// ---- 画面消灯防止 ----
async function syncWake(active) {
  try {
    if (settings.wake && active && !wakeLock && document.visibilityState === 'visible' && 'wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } else if ((!settings.wake || !active) && wakeLock) {
      await wakeLock.release(); wakeLock = null;
    }
  } catch {}
}

function tick() {
  const now = new Date();
  const win = activeWindow(now);
  let origin = null, mode = '待機中', end = null;
  if (manualStart) { origin = manualStart; mode = '手動'; }
  else if (win) { origin = win.st.getTime(); mode = '自動'; end = win.en; }

  const tag = $('modeTag');
  tag.textContent = mode; tag.classList.toggle('on', !!origin);
  syncWake(!!origin);

  if (!origin) {
    lastKey = null;
    const nx = nextWindow(now);
    const sub = nx
      ? `次の自動開始: ${DAYS[nx.getDay()]}曜 ${fmtHM(nx)}`
      : (settings.auto ? 'スケジュールを追加してください' : '自動開始はオフです');
    $('phase').textContent = '待機中';
    $('phase').style.color = '';
    $('time').textContent = fmt(WORK * 60000);
    $('barFill').style.width = '0';
    $('dots').innerHTML = [1,2,3,4].map(() => '<div class="dot"></div>').join('');
    $('sub').textContent = sub;
    $('startBtn').textContent = '今すぐ開始';
    document.title = 'スケジュール式ポモドーロ';
    setFavicon('P', HEX.idle);
    renderPip('待機中', fmt(WORK * 60000), sub, HEX.idle);
    return;
  }

  const r = phaseAt(now.getTime() - origin);
  const key = origin + ':' + Math.floor((now.getTime() - origin) / CYCLE) + ':' + r.idx;
  if (lastKey !== null && key !== lastKey) announce(`${label(r.p)}が始まります`);
  if (lastKey === null && mode === '自動') announce('スケジュール開始: 作業 1/4');
  lastKey = key;

  const kind = kindOf(r.p);
  const sub = end ? `この枠は ${fmtHM(end)} まで` : '手動で実行中';
  $('phase').textContent = label(r.p);
  $('phase').style.color = CSS[kind];
  $('time').textContent = fmt(r.left);
  $('barFill').style.width = ((1 - r.left / r.len) * 100) + '%';
  $('barFill').style.background = CSS[kind];
  $('dots').innerHTML = [1,2,3,4].map(i =>
    `<div class="dot${i < r.p.set || (i === r.p.set && r.p.kind === 'break') ? ' done' : ''}${i === r.p.set ? ' now' : ''}"></div>`).join('');
  $('sub').textContent = sub;
  $('startBtn').textContent = 'やり直す';
  document.title = `${fmt(r.left)} ${label(r.p)}`;
  setFavicon(String(Math.ceil(r.left / 60000)), HEX[kind]);
  renderPip(label(r.p), fmt(r.left), sub, HEX[kind]);
}

// ---- Web Worker でカウント(別タブでも間引かれにくい) ----
let timer = null;
function startClock() {
  try {
    const url = URL.createObjectURL(new Blob(['setInterval(()=>postMessage(0),500)'], { type:'text/javascript' }));
    const w = new Worker(url);
    w.onmessage = tick;
    return;
  } catch {}
  timer = setInterval(tick, 500);
}
document.addEventListener('visibilitychange', () => { tick(); });

// ---- スケジュールUI ----
function renderList() {
  $('list').innerHTML = schedules.length ? '' : '<div class="sub">スケジュールがありません</div>';
  schedules.forEach((s, i) => {
    const el = document.createElement('div');
    el.className = 'sched';
    el.innerHTML = `<input type="checkbox" ${s.on ? 'checked' : ''}>
      <strong>${s.start}〜${s.end}</strong>
      <span class="days">${s.days.map(d => DAYS[d]).join(' ') || '曜日未選択'}</span>
      <button>削除</button>`;
    el.querySelector('input').onchange = e => { s.on = e.target.checked; save('pomo.schedules', schedules); tick(); };
    el.querySelector('button').onclick = () => { schedules.splice(i, 1); save('pomo.schedules', schedules); renderList(); tick(); };
    $('list').appendChild(el);
  });
}

$('daypick').innerHTML = DAYS.map((d, i) =>
  `<label><input type="checkbox" value="${i}" ${i >= 1 && i <= 5 ? 'checked' : ''}>${d}</label>`).join('');

$('addBtn').onclick = () => {
  const days = [...document.querySelectorAll('#daypick input:checked')].map(x => +x.value);
  const start = $('newStart').value, end = $('newEnd').value;
  if (!start || !end || !days.length || start === end) return alert('時間と曜日を正しく設定してください');
  schedules.push({ start, end, days, on:true });
  schedules.sort((a, b) => a.start.localeCompare(b.start));
  save('pomo.schedules', schedules); renderList(); tick();
};

function askNotify() {
  if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
}
$('startBtn').onclick = () => {
  manualStart = Date.now(); save('pomo.manual', manualStart); lastKey = null; tick(); askNotify();
};
$('stopBtn').onclick = () => { manualStart = null; save('pomo.manual', null); lastKey = null; tick(); };

if ('documentPictureInPicture' in window) { $('pipBtn').hidden = false; $('pipBtn').onclick = openPip; }

$('autoOn').checked = settings.auto;
$('notifyOn').checked = settings.notify;
$('wakeOn').checked = settings.wake;
$('autoOn').onchange = e => { settings.auto = e.target.checked; save('pomo.settings', settings); tick(); };
$('notifyOn').onchange = e => { settings.notify = e.target.checked; save('pomo.settings', settings); if (e.target.checked) askNotify(); };
$('wakeOn').onchange = e => { settings.wake = e.target.checked; save('pomo.settings', settings); tick(); };

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});

renderList();
tick();
startClock();
</script>
</body>
</html>
